name: publish

# Publishes `addisai` to npm with provenance.
# Create a GitHub Release (tag e.g. v0.1.0) to trigger, or run manually.
# Uses npm trusted publishing when configured; NPM_TOKEN remains a fallback.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Release tag or commit to publish (blank uses the selected ref)"
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          # npm trusted publishing needs Node >=22.14 and npm >=11.5.1.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Verify publishing runtime
        run: |
          node --version
          npm --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # Guard: never ship a source map that embeds the original source.
      - run: |
          if grep -rlq "sourcesContent" dist 2>/dev/null; then
            echo "::error::A dist source map embeds sourcesContent — refusing to publish."
            exit 1
          fi
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
